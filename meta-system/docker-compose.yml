# ===================================================
# Docker Compose - כס המלך עיצובים
# מפעיל את כל המערכת בפקודה אחת!
# ===================================================

version: '3.8'

services:

  # השרת הראשי
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs

  # מסד הנתונים
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB:       kas_hamelech
      POSTGRES_USER:     admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kashamelech123}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  # Redis - לתורי הודעות
  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  pgdata:
